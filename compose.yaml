services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=securetalk'
      - 'POSTGRES_PASSWORD=8080'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5433:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securetalk"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']


